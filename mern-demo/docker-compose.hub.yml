services:
  backend:
    image: lehoangkhanhvinh/mern-backend:1.1
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: "mongodb+srv://cloudlab_user:a12345@cluster0.xzqvr0r.mongodb.net/cloud_lab?appName=Cluster0"
    networks:
      - mern-network

  frontend:
    image: lehoangkhanhvinh/mern-frontend:2.1
    container_name: mern-frontend-hub
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mern-network

networks:
  mern-network: